<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix — Смотреть сериалы онлайн, смотреть фильмы онлайн</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero">
        <div class="overlay"></div>

        <header class="header">
            <div class="logo">NETFLIX</div>
            <div class="header-buttons">
                <select class="lang-select">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
                <a href="#" class="btn-login">Войти</a>
            </div>
        </header>

        <div class="hero-content">
            <h1>Фильмы, сериалы и многое другое без ограничений</h1>
            <p class="subtitle">От 7,99 €. Отменить подписку можно в любое время.</p>
            <p class="description">
                Готовы смотреть? Введите адрес электронной почты, чтобы оформить или возобновить подписку.
            </p>

            <form class="email-form">
                <input type="email" placeholder="Адрес электронной почты" required>
                <button type="submit" class="btn-start">
                    Начать смотреть <span>&gt;</span>
                </button>
            </form>
        </div>
    </div>

</body>
</html>
